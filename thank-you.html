  header { padding:1.2rem 2.5rem; border-bottom:1px solid rgba(255,255,255,0.06); }
  .logo { display:inline-flex; align-items:center; gap:0.7rem; text-decoration:none; color:var(--light); font-size:1.3rem; font-weight:700; letter-spacing:0.08em; }
  .logo span.y { color:var(--gold); }
  .logo .tree-mark { height:40px; }
  main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:3rem 1.5rem; position:relative; overflow:hidden; }
  main::before { content:""; position:absolute; width:620px; height:620px; top:50%; left:50%; transform:translate(-50%,-50%); background:radial-gradient(circle, rgba(13,115,119,0.14) 0%, transparent 70%); pointer-events:none; }
  main > * { position:relative; }
  .hero-tree { height:clamp(90px, 18vh, 170px); margin-bottom:1.2rem; }
  h1 { font-size:clamp(2rem, 5vw, 3.2rem); font-weight:400; line-height:1.15; letter-spacing:-0.02em; margin-bottom:1rem; max-width:760px; }
  h1 em { font-style:italic; color:var(--gold); }
  .rule { width:70px; height:2px; background:var(--gold); margin:0 auto 1.4rem; }
  .lead { font-size:clamp(1rem, 2vw, 1.15rem); color:var(--text-light); line-height:1.7; max-width:560px; margin-bottom:2.4rem; }
  .follow-label { font-size:0.7rem; letter-spacing:0.25em; text-transform:uppercase; color:rgba(255,255,255,0.45); margin-bottom:1.3rem; }
  .social-tiles { display:grid; grid-template-columns:repeat(8, 76px); gap:1rem 0.6rem; justify-content:center; margin-bottom:2.6rem; }
  .social-tile { display:flex; flex-direction:column; align-items:center; gap:0.55rem; text-decoration:none; color:var(--light); }
  .social-icon { width:56px; height:56px; border-radius:13px; background:var(--teal-light); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:1.4rem; line-height:1; transition:background 0.2s, transform 0.2s; }
  .social-name { font-size:0.74rem; letter-spacing:0.04em; color:rgba(255,255,255,0.85); transition:color 0.2s; }
  .social-tile:hover .social-icon, .social-tile:focus-visible .social-icon { background:var(--gold); color:var(--dark); transform:translateY(-2px); }
  .social-tile:hover .social-name, .social-tile:focus-visible .social-name { color:var(--gold); }
  .btn { background:var(--teal); color:#fff; padding:0.9rem 2.2rem; border-radius:2px; font-size:0.85rem; letter-spacing:0.1em; text-transform:uppercase; text-decoration:none; display:inline-block; transition:background 0.2s, transform 0.2s; }
  .btn:hover, .btn:focus-visible { background:var(--teal-light); transform:translateY(-1px); }

  .foot-brand { font-size:0.95rem; color:rgba(255,255,255,0.7); }
  .foot-brand b { color:var(--light); letter-spacing:0.06em; }
  .foot-brand b span { color:var(--gold); }
  .foot-copy { font-size:0.72rem; color:rgba(255,255,255,0.35); }
  @media (max-width:900px) { .social-tiles { grid-template-columns:repeat(4, 76px); } }
  @media (max-width:600px) { header { padding:1rem 1.5rem; } footer { padding:1.5rem; flex-direction:column; align-items:flex-start; } .social-tiles { grid-template-columns:repeat(4, minmax(0,1fr)); width:100%; max-width:360px; } }
